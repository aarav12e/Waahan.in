name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Verify Required Secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.FTP_SERVER || secrets.FTP_HOST || secrets.HOSTINGER_FTP_SERVER || secrets.HOSTINGER_FTP_HOST }}" ]; then
            echo "::error::Secret 'FTP_SERVER' (or 'FTP_HOST') is missing! Go to https://github.com/aarav12e/Waahan.in/settings/secrets/actions and add FTP_SERVER."
            MISSING=1
          fi
          if [ -z "${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.HOSTINGER_FTP_USERNAME }}" ]; then
            echo "::error::Secret 'FTP_USERNAME' is missing! Go to https://github.com/aarav12e/Waahan.in/settings/secrets/actions and add FTP_USERNAME."
            MISSING=1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD || secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "::error::Secret 'FTP_PASSWORD' is missing! Go to https://github.com/aarav12e/Waahan.in/settings/secrets/actions and add FTP_PASSWORD."
            MISSING=1
          fi
          if [ $MISSING -eq 1 ]; then
            echo "Stopping deployment due to missing GitHub Secrets."
            exit 1
          fi
          echo "FTP configuration secrets verified."

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST || secrets.HOSTINGER_FTP_SERVER || secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: ./frontend/dist/
          dangerous-clean-slate: false

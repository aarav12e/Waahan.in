name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Verify and Sanitize Secrets
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER || secrets.FTP_HOST || secrets.HOSTINGER_FTP_SERVER || secrets.HOSTINGER_FTP_HOST }}"
          # Automatically strip protocols (ftp://, https://, http://), trailing paths, and port numbers
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|/.*$||' | sed -E 's|:[0-9]+$||' | xargs)
          
          MISSING=0
          if [ -z "$CLEAN_SERVER" ]; then
            echo "::error::Secret 'FTP_SERVER' (or 'FTP_HOST') is missing! Go to https://github.com/aarav12e/Waahan.in/settings/secrets/actions and add FTP_SERVER."
            MISSING=1
          fi
          if [ -z "${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.HOSTINGER_FTP_USERNAME }}" ]; then
            echo "::error::Secret 'FTP_USERNAME' is missing! Go to https://github.com/aarav12e/Waahan.in/settings/secrets/actions and add FTP_USERNAME."
            MISSING=1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD || secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "::error::Secret 'FTP_PASSWORD' is missing! Go to https://github.com/aarav12e/Waahan.in/settings/secrets/actions and add FTP_PASSWORD."
            MISSING=1
          fi

          if [ $MISSING -eq 1 ]; then
            echo "Stopping deployment due to missing GitHub Secrets."
            exit 1
          fi

          echo "Target FTP Server hostname/IP: $CLEAN_SERVER"
          echo "CLEAN_FTP_SERVER=$CLEAN_SERVER" >> $GITHUB_ENV

      - name: Install LFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to Hostinger (LFTP Mirror)
        env:
          FTP_HOST: ${{ env.CLEAN_FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER || secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD || secrets.HOSTINGER_FTP_PASSWORD }}
          TARGET_DIR: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
        run: |
          echo "Starting LFTP upload to $FTP_HOST ..."
          lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-force false
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          open ftp://$FTP_HOST
          user $FTP_USER $FTP_PASS
          ls
          rm -rf public_html/
          mirror --reverse --verbose --no-perms ./frontend/dist/ ./
          bye
          EOF
          echo "LFTP deployment completed successfully!"
